{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EUCL Wellness M&amp;E</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <picture>
      <source srcset="{% static 'img/reg-logo-light.png' %}" media="(prefers-color-scheme: dark)">
      <img src="{% static 'img/reg-logo.png' %}" alt="Rwanda Energy Group (REG)" class="reg-logo" width="156" height="60">
    </picture>
    <div class="brand" style="padding:14px 0 0">
      <span class="brand-mark" aria-hidden="true">M&amp;E</span>
      <span><span class="brand-name">Wellness</span><br><span class="brand-sub">Monitoring &amp; Evaluation</span></span>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Use your EUCL Wellness Management System username and password.</p>
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username <input name="username" value="{{ username }}" autocomplete="username" autofocus required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
