{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EUCL Wellness M&amp;E</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=ocean2">
  <script src="{% static 'js/theme.js' %}?v=ocean2"></script>
</head>
<body>
<div class="login-page">
  <div class="theme-switch login-theme" role="radiogroup" aria-label="Theme">
    <button type="button" class="theme-option" role="radio" data-theme-value="light" title="Light theme" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
    <button type="button" class="theme-option" role="radio" data-theme-value="dark" title="Dark theme" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <button type="button" class="theme-option" role="radio" data-theme-value="ocean" title="Ocean theme" aria-label="Ocean theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7c2-1.6 3.5-1.6 5 0s3 1.6 5 0 3.5-1.6 5 0 3 1.6 5 0M2 12c2-1.6 3.5-1.6 5 0s3 1.6 5 0 3.5-1.6 5 0 3 1.6 5 0M2 17c2-1.6 3.5-1.6 5 0s3 1.6 5 0 3.5-1.6 5 0 3 1.6 5 0"/></svg></button>
  </div>
  <div class="login-card">
    <img src="{% static 'img/reg-logo.png' %}" alt="Rwanda Energy Group (REG)" class="reg-logo logo-light" width="156" height="60">
    <img src="{% static 'img/reg-logo-light.png' %}" alt="Rwanda Energy Group (REG)" class="reg-logo logo-dark" width="156" height="60">
    <div class="brand" style="padding:14px 0 0">
      <span class="brand-mark" aria-hidden="true">M&amp;E</span>
      <span><span class="brand-name">Wellness</span><br><span class="brand-sub">Monitoring &amp; Evaluation</span></span>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Use your EUCL Wellness Management System username and password.</p>
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username <input name="username" value="{{ username }}" autocomplete="username" autofocus required></label>
      <label>Password
        <span class="password-field">
          <input name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" aria-label="Show password" title="Show password" aria-pressed="false"><svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg><svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94 M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19 M14.12 14.12a3 3 0 1 1-4.24-4.24 M1 1l22 22"/></svg></button>
        </span>
      </label>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
